name: swapna_garments
description: Swapna Garments worker app using the shared website APIs.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  dio: ^5.11.1
  flutter_secure_storage: ^11.1.1
  mobile_scanner: ^7.4.2
  flutter_svg: ^2.3.0
  uuid: ^4.6.0
  intl: ^0.20.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/builtin-artwork.json
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist.ttf
    - family: StudioSerif
      fonts:
        - asset: assets/fonts/StudioSerif.ttf
